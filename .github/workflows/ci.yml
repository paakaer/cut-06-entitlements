name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The cut's own compose file, not a services: container: db/init/*.sql creates
      # the role split on first boot from a mounted directory, which needs the checkout.
      - name: Start Postgres 18
        run: docker compose up -d --wait

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun test

      - name: Stop Postgres
        if: always()
        run: docker compose down -v
